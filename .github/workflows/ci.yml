name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright browsers aren't preinstalled on GH runners; the storybook
      # vitest project needs chromium (+ system deps) for the browser-mode tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm spell
      - run: pnpm format
      - run: pnpm build
      - run: pnpm assert:use-client
      - run: pnpm smoke:dist
      - run: pnpm test
      - run: pnpm verify:pack
      - run: pnpm verify:types

  chromatic:
    needs: correctness
    # Fork PRs can't read CHROMATIC_PROJECT_TOKEN (secrets are repo-scoped), so
    # the job would hard-fail; skip it there instead of blocking the PR.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Storybook's preview.tsx side-effect-imports ../dist/styles.css (the
      # precompiled CSS output). Build the lib first so the file exists
      # when chromaui/action runs `build-storybook`. dist/ is gitignored, so
      # this is necessary in CI even though it's already present locally.
      - run: pnpm build
      - uses: chromaui/action@22b91fb07d2fe5a6e13dd284fc7b11dd162c143a # v18.9.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # All other policy (onlyChanged, autoAcceptChanges, exitZeroOnChanges,
          # buildScriptName) lives in chromatic.config.json so local
          # `pnpm chromatic` and CI behave identically.
