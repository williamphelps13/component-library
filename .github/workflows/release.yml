name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # tag, GitHub release, push the Version Packages PR
  pull-requests: write # open the Version Packages PR
  id-token: write # npm OIDC trusted publishing (no stored token)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token from a GitHub App so the Version Packages PR is
      # authored by the App, not GITHUB_TOKEN. GITHUB_TOKEN events don't trigger
      # workflows (anti-recursion), so a GITHUB_TOKEN-authored PR never runs the
      # required CI checks and can't be merged. An App-authored PR does.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # changelog-github resolves commits to PRs via full history
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Release workflow runs in parallel with CI (separate workflows, no
      # gating) and prepublishOnly is build-only — without these steps a
      # merge-skew break on main can publish. Duplicating CI here is deliberate.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

      - name: Create Release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
